<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity777 OS — Sovereign Core Shell</title>

    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --fg: #f5f7ff;
        --card: #0b1020;
        --border: #1e293b;
        --accent: #4ade80;
        --muted: #9ca3af;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
      }

      #app {
        padding: 2rem;
        display: flex;
        justify-content: center;
      }

      .card {
        background: var(--card);
        padding: 2rem;
        border-radius: 1rem;
        border: 1px solid var(--border);
        max-width: 800px;
        width: 100%;
      }

      input,
      textarea {
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #111827;
        border: 1px solid var(--border);
        color: var(--fg);
        margin-top: 0.5rem;
      }

      button {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: var(--accent);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        color: #000;
        font-weight: bold;
      }

      .pill {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        margin-right: 0.5rem;
        margin-top: 0.5rem;
        font-size: 0.8rem;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      // -------------------------------
      // INFINITY777 SOVEREIGN KERNEL
      // -------------------------------
      const sovereignKernel = {
        version: "0.0.1",
        telemetry: false,
        surveillance: false,
        forcedUpdates: false,

        log(msg) {
          console.log("[Infinity777 Kernel]", msg);
        }
      };

      // -------------------------------
      // SOVEREIGN IDENTITY ENGINE
      // -------------------------------
      const identity = {
        name: "",
        bio: "",
        sovereignId: crypto.randomUUID()
      };

      function saveIdentity(name, bio) {
        identity.name = name;
        identity.bio = bio;
        sovereignKernel.log("Identity updated locally (never transmitted).");
      }

      // -------------------------------
      // ECO-COMPUTE ENGINE
      // -------------------------------
      function ecoCompute(task) {
        const start = performance.now();
        task();
        const end = performance.now();
        console.log("EcoCompute cycle:", (end - start).toFixed(2), "ms");
      }

      // -------------------------------
      // RENDER UI
      // -------------------------------
      document.getElementById("app").innerHTML = `
        <div class="card">
          <h1>Infinity777 OS — Core Shell</h1>
          <p>Local-first. Surveillance-free. Human-first. Eco-aligned.</p>

          <label>Your Name</label>
          <input id="nameInput" placeholder="Local only" />

          <label>Your Bio</label>
          <textarea id="bioInput" placeholder="Local only"></textarea>

          <button id="saveBtn">Save Sovereign Identity</button>

          <h3>System Guarantees</h3>
          <div>
            <span class="pill">No telemetry</span>
            <span class="pill">No surveillance</span>
            <span class="pill">No forced updates</span>
            <span class="pill">Local-first compute</span>
            <span class="pill">User-owned identity</span>
            <span class="pill">Eco-aware execution</span>
          </div>

          <h3>Kernel</h3>
          <p>Infinity777 Kernel v${sovereignKernel.version} — All protections active.</p>
        </div>
      `;

      // -------------------------------
      // BUTTON LOGIC
      // -------------------------------
      document.getElementById("saveBtn").onclick = () => {
        const name = document.getElementById("nameInput").value;
        const bio = document.getElementById("bioInput").value;

        ecoCompute(() => saveIdentity(name, bio));
      };
    </script>
  </body>
</html>
